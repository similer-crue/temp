<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial,Helvetica,sans-serif}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}
.b{background:#4389cf}.o{background:#edbd32}
.table-wrap{background:#fff;border:1px solid #e3e7eb;border-radius:12px;overflow:auto}

.num{color:#8a939b}.roll{font-weight:700;white-space:nowrap}.name{font-weight:600}
.state-btn{width:23px;height:23px;border-radius:5px;border:2px solid #c7cdd2;background:#fff;cursor:pointer;display:inline-block}
.state-btn.placed{background:#4389cf;border-color:#4389cf}
.state-btn.masters{background:#f2c94c;border-color:#f2c94c}
.state-wrap{display:flex;gap:8px;align-items:center}
.company{padding:8px 10px;border:1px solid #ccd3d9;border-radius:7px;width:280px;font:inherit}
.company:read-only{background:#f8f8f8}
.checked{background:#f1f8f3}
.empty{padding:30px;text-align:center;color:#68727d}
.action{padding:9px 13px;border:0;border-radius:8px;background:#eef1f3;color:#263238;cursor:pointer;font:inherit}
</style>

const KEY="placementChecklistSorted_v2";
const initialState={};
students.forEach(s=>initialState[s.uid]={status:s.status||"",company:s.company||""});
let state=JSON.parse(localStorage.getItem(KEY)||"null")||initialState;

function get(s){return state[s.uid]||{status:"",company:""}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setState(uid,v){
 let s=students.find(x=>x.uid===uid), x=get(s);
 if(x.status===v){state[uid]={status:"",company:""}}
 else if(v==="masters"){state[uid]={status:"masters",company:"Masters"}}
 else{state[uid]={status:"placed",company:x.company==="Masters"?"":x.company}}
 save()
}
function setCompany(uid,v){state[uid]={...get(students.find(x=>x.uid===uid)),company:v};localStorage.setItem(KEY,JSON.stringify(state))}
function matches(s,q){
 q=q.toLowerCase();let x=get(s);
 return [s.name,s.roll,s.batch,x.company].join(" ").toLowerCase().includes(q)
}
function renderAll(){
 let q1=document.getElementById("search1").value,q2=document.getElementById("search2").value;
 document.getElementById("body1").innerHTML=students.filter(s=>matches(s,q1)).map(s=>{
   let x=get(s),status=x.status||"";
   return `<tr class="${status?'checked':''}">
   <td class="num">${s.displayNo}</td><td>${esc(s.batch)}</td><td class="roll">${esc(s.roll)}</td>
   <td class="name">${esc(s.name)}</td>
   <td><div class="state-wrap">
   <button class="state-btn ${status==="placed"?"placed":""}" title="Placed" onclick="setState('${s.uid}','placed')"></button>
   <button class="state-btn ${status==="masters"?"masters":""}" title="Further Studies" onclick="setState('${s.uid}','masters')"></button>
   </div></td>
   <td><input class="company" value="${esc(status==="masters"?"Masters":x.company)}" placeholder="Enter company name" ${status==="masters"?"readonly":""} oninput="setCompany('${s.uid}',this.value)"></td>
   </tr>`
 }).join("")||'<tr><td colspan="6" class="empty">No students found.</td></tr>';

 document.getElementById("body2").innerHTML=students.filter(s=>matches(s,q2)).map(s=>{
   let x=get(s);
   return `<tr><td class="num">${s.displayNo}</td><td>${esc(s.batch)}</td><td class="roll">${esc(s.roll)}</td><td class="name">${esc(s.name)}</td>
   <td><input class="company" value="${esc(x.company)}" placeholder="Enter company name" ${x.status==="masters"?"readonly":""} oninput="setCompany('${s.uid}',this.value)"></td></tr>`
 }).join("")||'<tr><td colspan="5" class="empty">No students found.</td></tr>';

 let placed=students.filter(s=>get(s).status==="placed").length;
 let masters=students.filter(s=>get(s).status==="masters").length;
 let companies=students.filter(s=>get(s).company.trim()).length;
 document.getElementById("stats1").textContent=`Placed: ${placed} • Further Studies: ${masters} • Unmarked: ${students.length-placed-masters}`;
 document.getElementById("stats2").textContent=`${companies} company entries`;
}
function resetAll(){if(confirm("Reset all ticks and company names?")){localStorage.removeItem(KEY);state=JSON.parse(JSON.stringify(initialState));renderAll()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")
});
["search1","search2"].forEach(id=>document.getElementById(id).addEventListener("input",renderAll));
renderAll();
</script>
